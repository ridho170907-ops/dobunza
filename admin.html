<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FCF8F5">
  <title>Admin Login | Dobunza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>

    <meta name="theme-color" content="#19161e">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

</head>
<body>
  <main class="login-page">
    <div class="login-glow glow-one"></div><div class="login-glow glow-two"></div>
    <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Kembali ke Dobunza</a>
    <section class="login-card">
      <div class="heart-mark" aria-hidden="true">♡</div>
      <p class="eyebrow">PRIVATE MEMORY SPACE</p>
      <h1>Welcome <em>Back</em></h1>
      <p class="login-description">Masuk ke ruang pribadi untuk mengelola kenangan indah kita.</p>
      <form id="loginForm">
        <label for="password">Kata sandi admin</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" autocomplete="current-password" required>
          <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan kata sandi">Lihat</button>
        </div>
        <p id="loginMessage" class="login-message" role="alert"></p>
        <button type="submit" class="login-button"><span>Masuk ke Dashboard</span><span aria-hidden="true">↗</span></button>
      </form>
      <p class="login-footer">Made with love, for our memories ♡</p>
    </section>
    <p class="page-note">DOBUNZA · OUR LITTLE WORLD</p>
  </main>

<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch((error) => {
      console.error("Dobunza PWA service worker registration failed:", error);
    });
  });
}
</script>

</body>
</html>
